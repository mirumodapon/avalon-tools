packages:
  - apps/*
  - packages/*

# Every external dependency version lives here; package.json files use "catalog:".
# strict: `pnpm add` must use (or add to) this catalog.
catalogMode: strict

catalog:
  '@catppuccin/palette': '^1.8.0'
  '@tabler/icons-react': '^3.52.0'
  '@tailwindcss/vite': '^4.3.5'
  '@testing-library/react': '^16.3.3'
  '@types/node': '^26.6.6'
  '@types/qrcode': '^1.5.6'
  '@types/react': '^19.3.0'
  '@types/react-dom': '^19.3.0'
  '@vite-pwa/assets-generator': '^2.0.0'
  '@vitejs/plugin-react': '^6.3.0'
  dexie: '^4.4.7'
  fake-indexeddb: '^6.2.8'
  html-to-image: '^1.11.13'
  jsdom: '^31.0.1'
  jsqr: '^1.4.0'
  mermaid: '^12.3.0'
  oxfmt: '^0.79.0'
  oxlint: '^1.94.0'
  qrcode: '^1.5.4'
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: '^4.3.5'
  typescript: 7.0.2
  vite: '^8.3.8'
  vite-plugin-pwa: '^2.0.0'
  vitepress: 2.0.0-alpha.21
  vitest: '^5.1.1'
  vue: '^3.5.45'
  workbox-window: '^7.4.1'
  zod: '^4.6.7'
  zustand: '^5.1.0'

# pnpm 12 refuses packages published less than a day ago (minimumReleaseAge).
# These exact versions were already locked when upgrading from pnpm 10 (published
# 2026-11-18); remove this list once they are older than a day.
minimumReleaseAgeExclude:
  - '@rollup/rollup-android-arm-eabi@4.68.6'
  - '@rollup/rollup-android-arm64@4.68.6'
  - '@rollup/rollup-android-x64@4.68.6'
  - '@rollup/rollup-darwin-arm64@4.68.6'
  - '@rollup/rollup-darwin-x64@4.68.6'
  - '@rollup/rollup-freebsd-arm64@4.68.6'
  - '@rollup/rollup-freebsd-x64@4.68.6'
  - '@rollup/rollup-linux-arm-gnueabihf@4.68.6'
  - '@rollup/rollup-linux-arm-musleabihf@4.68.6'
  - '@rollup/rollup-linux-arm64-gnu@4.68.6'
  - '@rollup/rollup-linux-arm64-musl@4.68.6'
  - '@rollup/rollup-linux-loong64-gnu@4.68.6'
  - '@rollup/rollup-linux-loong64-musl@4.68.6'
  - '@rollup/rollup-linux-ppc64-gnu@4.68.6'
  - '@rollup/rollup-linux-ppc64-musl@4.68.6'
  - '@rollup/rollup-linux-riscv64-gnu@4.68.6'
  - '@rollup/rollup-linux-riscv64-musl@4.68.6'
  - '@rollup/rollup-linux-s390x-gnu@4.68.6'
  - '@rollup/rollup-linux-x64-gnu@4.68.6'
  - '@rollup/rollup-linux-x64-musl@4.68.6'
  - '@rollup/rollup-openbsd-x64@4.68.6'
  - '@rollup/rollup-openharmony-arm64@4.68.6'
  - '@rollup/rollup-win32-arm64-msvc@4.68.6'
  - '@rollup/rollup-win32-ia32-msvc@4.68.6'
  - '@rollup/rollup-win32-x64-gnu@4.68.6'
  - '@rollup/rollup-win32-x64-msvc@4.68.6'
  - '@vitest/mocker@5.1.1'
  - 'electron-to-chromium@1.5.490'
  - 'rollup@4.68.6'
  - 'vitest@5.1.1'
