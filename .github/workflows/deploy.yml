name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test

      - id: pages
        uses: actions/configure-pages@v6

      # Every tool is served from the domain root (/, /record/, …); a project-site
      # sub-path such as /<repo>/ would break links, manifests and service workers.
      - name: Require deployment at the domain root
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$BASE_PATH" ] && [ "$BASE_PATH" != "/" ]; then
            echo "::error::Pages serves this site under $BASE_PATH. Set a custom domain (Settings → Pages) so it is served at /."
            exit 1
          fi

      # Builds every app in the registry and assembles them into dist/ (see scripts/build-all.ts).
      - name: Build all tools
        run: pnpm build

      - name: Summary
        run: |
          {
            echo "### Deployed tools"
            echo
            echo "| Path | App |"
            echo "| --- | --- |"
            for f in $(find dist -name manifest.webmanifest | sort); do
              node -e "const m=JSON.parse(require('fs').readFileSync('$f','utf8'));console.log('| \`' + m.scope + '\` | ' + m.name + ' |')"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
